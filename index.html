<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Challenge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin-bottom: 1rem;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.7rem 1.2rem;
      border: none;
      background: #3498db;
      color: white;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trivia Challenge</h1>
    <p>¡Pon a prueba tus conocimientos con nuestra trivia!</p>
    <button onclick="startTrivia()">Comenzar</button>
  </div>

  <script>
    function startTrivia() {
      alert("Aquí comenzaría la trivia.");
    }
  </script>
</body>
</html>
