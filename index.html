<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project TrivIA</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MENÚ -->
<div id="menu" class="center">
    <h1>Project TrivIA</h1>
    <p>Responde 10 preguntas correctas. Tienes 3 vidas.</p>
    <div class="btn" onclick="startNewGame()">Iniciar Juego</div>
</div>

<!-- HUD -->
<div id="hud" class="hud hidden">
    <span id="vidas"></span>
    <span id="contador"></span>
</div>

<!-- JUEGO -->
<div id="game" class="game-container hidden">
    <div id="questionBox"></div>
    <div id="options"></div>

    <!-- FEEDBACK -->
    <div id="feedback" class="hidden">
        <p id="feedbackText"></p>
        <p id="correctAnswerText"></p>
        <div class="btn" onclick="continuar()">Siguiente pregunta</div>
    </div>
</div>

<!-- RESULTADO FINAL -->
<div id="resultBox" class="center hidden"></div>

<script src="API.js"></script>
<script src="Trivia.js"></script>
</body>
</html>
